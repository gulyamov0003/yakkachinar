    <style>
      /* Logo preloader: painted from the HTML so it covers the moment before JavaScript runs. */
      .preloader {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: radial-gradient(60% 50% at 50% 50%, #17120d 0%, #0c0b09 70%);
        transition:
          opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0.6s;
      }
      .preloader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .preloader__mark {
        position: relative;
        width: 108px;
        height: 108px;
        border-radius: 50%;
        opacity: 0;
        transform: translateY(6px) scale(0.94);
        box-shadow:
          0 0 0 1px rgba(201, 169, 110, 0.35),
          0 24px 60px rgba(0, 0, 0, 0.6);
        animation: preloader-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .preloader__mark img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
      }
      .preloader__sheen {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        opacity: 0;
        background: linear-gradient(112deg, transparent 32%, rgba(255, 246, 222, 0.9) 47%, rgba(255, 232, 180, 0.45) 53%, transparent 68%) no-repeat;
        background-size: 260% 100%;
        background-position: 135% 0;
        -webkit-mask: url('/brand/yakkachinar-logo-gold-256.webp') center / 100% 100% no-repeat;
        mask: url('/brand/yakkachinar-logo-gold-256.webp') center / 100% 100% no-repeat;
        mix-blend-mode: screen;
        animation: preloader-sheen 0.8s cubic-bezier(0.45, 0, 0.25, 1) 0.15s forwards;
      }
      @keyframes preloader-in {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes preloader-sheen {
        0% {
          opacity: 0;
          background-position: 135% 0;
        }
        20%,
        75% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          background-position: -35% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader {
          display: none;
        }
      }
    </style>
    <noscript><style>.preloader { display: none; }</style></noscript>
